<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafariFlow AI — Reservations Platform</title>
  <style>
    /* ===== DESIGN TOKENS — colours, type, spacing. Edit here. ===== */
    :root{
      --bg:#f4f0e8;
      --panel:#fffdf8;
      --panel-2:#ebe6da;
      --text:#1d241f;
      --muted:#69736b;
      --green:#1f4a3a;
      --green-2:#32644f;
      --sage:#9cab92;
      --sand:#d6c4a5;
      --clay:#a86743;
      --gold:#b99553;
      --danger:#a74a3c;
      --warning:#b98530;
      --line:#ded8cb;
      --shadow:0 18px 50px rgba(30,44,34,.08);
      --radius:22px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    h1,h2,h3,h4{
      margin:0;
      font-family:Georgia, "Times New Roman", serif;
      font-weight:500;
      letter-spacing:-0.02em;
    }

    button,input,select,textarea{font:inherit}
    button{cursor:pointer}

    .app{
      min-height:100vh;
      display:grid;
      grid-template-columns:270px 1fr;
    }

    .sidebar{
      position:sticky;
      top:0;
      height:100vh;
      background:#15372d;
      color:#fff;
      padding:28px 20px;
      display:flex;
      flex-direction:column;
      gap:28px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 8px;
    }

    .brand-mark{
      width:42px;
      height:42px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.38);
      display:grid;
      place-items:center;
      font-size:20px;
      background:rgba(255,255,255,.06);
    }

    .brand-copy strong{
      display:block;
      font-size:17px;
      letter-spacing:.02em;
    }

    .brand-copy span{
      display:block;
      font-size:11px;
      color:rgba(255,255,255,.55);
      margin-top:3px;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .nav button{
      width:100%;
      border:0;
      background:transparent;
      color:rgba(255,255,255,.68);
      text-align:left;
      padding:12px 14px;
      border-radius:12px;
      transition:.2s;
    }

    .nav button:hover,
    .nav button.active{
      background:rgba(255,255,255,.1);
      color:#fff;
    }

    .nav .label{
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.16em;
      color:rgba(255,255,255,.35);
      padding:12px 14px 5px;
    }

    .sidebar-bottom{
      margin-top:auto;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      padding:16px;
    }

    .sidebar-bottom small{color:rgba(255,255,255,.55)}
    .sidebar-bottom strong{display:block;margin:6px 0 12px}
    .usage-bar{
      width:100%;
      height:7px;
      border-radius:99px;
      background:rgba(255,255,255,.12);
      overflow:hidden;
    }
    .usage-bar > div{
      width:68%;
      height:100%;
      background:#d9c49b;
    }

    .mode-switch small{
      display:block;
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.16em;
      color:rgba(255,255,255,.35);
      padding:0 14px 8px;
    }
    .mode-options{
      display:flex;
      gap:4px;
      padding:4px;
      border-radius:12px;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.08);
    }
    .mode-options button{
      flex:1;
      border:0;
      background:transparent;
      color:rgba(255,255,255,.68);
      padding:8px 10px;
      border-radius:9px;
      font-size:12px;
      transition:.2s;
    }
    .mode-options button:hover,
    .mode-options button.active{
      background:rgba(255,255,255,.1);
      color:#fff;
    }
    .mode-hidden{display:none !important}

    .main{
      min-width:0;
      padding:26px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-bottom:24px;
    }

    .eyebrow{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.17em;
      color:var(--muted);
      margin-bottom:6px;
    }

    .topbar h1{font-size:34px}
    .top-actions{display:flex;gap:10px;align-items:center}
    .btn{
      border:1px solid var(--line);
      background:var(--panel);
      color:var(--text);
      padding:11px 14px;
      border-radius:12px;
      box-shadow:0 4px 14px rgba(0,0,0,.02);
    }
    .btn.primary{
      background:var(--green);
      color:white;
      border-color:var(--green);
    }

    .grid{
      display:grid;
      gap:16px;
    }
    .metrics{
      grid-template-columns:repeat(6,minmax(0,1fr));
      margin-bottom:16px;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }

    .metric{
      padding:18px;
      min-height:126px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .metric .label{
      color:var(--muted);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.12em;
    }
    .metric .value{
      font-size:30px;
      font-family:Georgia,serif;
    }
    .metric .trend{
      font-size:12px;
      color:var(--green-2);
    }

    .main-grid{
      grid-template-columns:1.4fr .8fr;
      align-items:start;
    }

    .section{
      padding:22px;
    }

    .section-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }
    .section-head h2{font-size:24px}
    .section-head p{
      margin:6px 0 0;
      color:var(--muted);
      font-size:13px;
    }

    .pipeline{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:10px;
    }
    .pipe{
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      background:#fbf8f1;
    }
    .pipe b{
      display:block;
      font-size:20px;
      margin-top:8px;
    }
    .pipe span{
      color:var(--muted);
      font-size:12px;
    }

    .inbox-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .inbox-item{
      border:1px solid var(--line);
      border-radius:16px;
      padding:15px;
      display:grid;
      grid-template-columns:1fr auto;
      gap:14px;
      background:#fffefa;
    }
    .inbox-item strong{font-size:14px}
    .inbox-meta{
      margin-top:6px;
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }
    .status{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:6px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:700;
      white-space:nowrap;
    }
    .status.green{background:#e7f1ec;color:#286247}
    .status.yellow{background:#f5ebd7;color:#926b25}
    .status.red{background:#f5e1dd;color:#964439}
    .status.gray{background:#ece9e2;color:#68645c}

    .attention{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .attention-item{
      border-left:3px solid var(--clay);
      background:#fbf6ef;
      padding:13px 14px;
      border-radius:10px;
    }
    .attention-item strong{font-size:13px}
    .attention-item p{
      margin:5px 0 0;
      color:var(--muted);
      font-size:12px;
    }

    .table-wrap{
      overflow:auto;
      border:1px solid var(--line);
      border-radius:16px;
    }
    table{
      width:100%;
      border-collapse:collapse;
      min-width:720px;
      background:#fffefa;
    }
    th,td{
      padding:13px 14px;
      border-bottom:1px solid var(--line);
      text-align:left;
      font-size:12px;
    }
    th{
      background:#f2eee5;
      color:var(--muted);
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .availability-cell{
      text-align:center;
      font-weight:700;
      border-radius:9px;
    }
    .available{background:#e6f2eb;color:#2e654d}
    .provisional{background:#f7eed9;color:#9a742e}
    .confirmed{background:#f3ded9;color:#984638}
    .closed{background:#e7e5df;color:#6b685f}

    .knowledge{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }
    .knowledge .tile{
      background:#faf6ee;
      border:1px solid var(--line);
      border-radius:15px;
      padding:15px;
    }
    .knowledge .tile b{display:block;margin-bottom:6px}
    .knowledge .tile span{font-size:12px;color:var(--muted)}

    .ai-box{
      background:#15372d;
      color:#fff;
      padding:22px;
      border-radius:20px;
      position:relative;
      overflow:hidden;
    }
    .ai-box::after{
      content:"";
      position:absolute;
      width:180px;
      height:180px;
      border-radius:50%;
      background:rgba(255,255,255,.05);
      right:-45px;
      bottom:-70px;
    }
    .ai-box p{
      color:rgba(255,255,255,.72);
      line-height:1.6;
      font-size:13px;
    }
    .ai-box .btn{
      background:#f1e7d5;
      border-color:#f1e7d5;
      color:#21362d;
      position:relative;
      z-index:1;
    }

    .page{display:none}
    .page.active{display:block}

    .page-grid{
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:16px;
    }

    .booking-card{
      padding:18px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fffefa;
      margin-bottom:12px;
    }

    .booking-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:start;
    }
    .booking-card h3{font-size:20px}
    .booking-info{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-top:15px;
    }
    .booking-info div span{
      display:block;
      color:var(--muted);
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.08em;
    }
    .booking-info div b{
      display:block;
      margin-top:4px;
      font-size:13px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }
    .form-group label{
      display:block;
      font-size:11px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:6px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea{
      width:100%;
      border:1px solid var(--line);
      background:#fffefa;
      border-radius:11px;
      padding:11px 12px;
      outline:none;
    }
    .form-group textarea{min-height:110px;resize:vertical}

    .chat{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .msg{
      max-width:82%;
      padding:13px 14px;
      border-radius:15px;
      font-size:13px;
      line-height:1.5;
    }
    .msg.user{
      align-self:flex-end;
      background:#e9e2d4;
    }
    .msg.ai{
      align-self:flex-start;
      background:#1f4a3a;
      color:white;
    }

    .mini-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .searchbar{
      width:100%;
      border:1px solid var(--line);
      background:var(--panel);
      border-radius:14px;
      padding:12px 14px;
      margin-bottom:14px;
    }

    @media(max-width:1100px){
      .metrics{grid-template-columns:repeat(3,1fr)}
      .main-grid,.page-grid{grid-template-columns:1fr}
      .app{grid-template-columns:220px 1fr}
    }
    @media(max-width:780px){
      .app{display:block}
      .sidebar{
        position:relative;
        height:auto;
        border-radius:0 0 24px 24px;
      }
      .nav{display:grid;grid-template-columns:repeat(2,1fr)}
      .nav .label{grid-column:1/-1}
      .main{padding:16px}
      .metrics{grid-template-columns:repeat(2,1fr)}
      .pipeline{grid-template-columns:1fr 1fr}
      .booking-info,.form-grid{grid-template-columns:1fr 1fr}
      .topbar{align-items:flex-start;flex-direction:column}
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">✦</div>
      <div class="brand-copy">
        <strong data-text="brand.name"></strong>
        <span data-text="brand.tagline"></span>
      </div>
    </div>

    <nav class="nav">
      <div class="label" data-text="nav.workspaceLabel"></div>
      <button class="active" data-page="dashboard" data-text="nav.dashboard"></button>
      <button data-page="inbox" data-text="nav.inbox"></button>
      <button data-page="availability" data-text="nav.availability"></button>
      <button data-page="bookings" data-text="nav.bookings"></button>
      <button data-page="invoices" data-text="nav.invoices"></button>
      <button data-page="knowledge" data-text="nav.knowledge"></button>
      <div class="label" data-text="nav.managementLabel"></div>
      <button data-page="automations" data-text="nav.automations"></button>
      <button data-page="reports" data-text="nav.reports"></button>
      <button data-page="settings" data-text="nav.settings"></button>
    </nav>

    <div class="mode-switch">
      <small data-text="setupMode.label"></small>
      <div class="mode-options">
        <button data-mode="layer" data-text="setupMode.layer"></button>
        <button data-mode="full" data-text="setupMode.full"></button>
      </div>
    </div>

    <div class="sidebar-bottom">
      <small data-text="sidebarStat.label"></small>
      <strong data-text="sidebarStat.value"></strong>
      <div class="usage-bar"><div></div></div>
    </div>
  </aside>

  <main class="main">
    <section id="dashboard" class="page active">
      <div class="topbar">
        <div>
          <div class="eyebrow" data-demo="lodge.name"></div>
          <h1 data-text="dashboard.greeting"></h1>
        </div>
        <div class="top-actions">
          <button class="btn" data-text="buttons.export"></button>
          <button class="btn primary" onclick="openNewBooking()" data-needs-page="bookings" data-text="buttons.newBooking"></button>
        </div>
      </div>

      <div class="grid metrics" id="dashboard-metrics"></div>

      <div class="grid main-grid">
        <div class="grid">
          <div class="card section">
            <div class="section-head">
              <div>
                <div class="eyebrow" data-text="dashboard.pipeline.eyebrow"></div>
                <h2 data-text="dashboard.pipeline.title"></h2>
                <p data-text="dashboard.pipeline.intro"></p>
              </div>
            </div>
            <div class="pipeline" id="dashboard-pipeline"></div>
          </div>

          <div class="card section">
            <div class="section-head">
              <div>
                <div class="eyebrow" data-text="dashboard.recentEnquiries.eyebrow"></div>
                <h2 data-text="dashboard.recentEnquiries.title"></h2>
              </div>
              <button class="btn" onclick="showPage('inbox')" data-text="buttons.viewInbox"></button>
            </div>

            <div class="inbox-list" id="dashboard-enquiries"></div>
          </div>

          <div class="card section">
            <div class="section-head">
              <div>
                <div class="eyebrow" data-text="dashboard.availabilityPreview.eyebrow"></div>
                <h2 data-text="dashboard.availabilityPreview.title"></h2>
              </div>
              <button class="btn" onclick="showPage('availability')" data-text="buttons.fullCalendar"></button>
            </div>
            <div class="table-wrap">
              <table id="dashboard-availability"></table>
            </div>
          </div>
        </div>

        <div class="grid">
          <div class="card section">
            <div class="section-head">
              <div>
                <div class="eyebrow" data-text="dashboard.attention.eyebrow"></div>
                <h2 data-text="dashboard.attention.title"></h2>
              </div>
            </div>
            <div class="attention" id="dashboard-attention"></div>
          </div>

          <div class="ai-box">
            <div class="eyebrow" style="color:rgba(255,255,255,.5)" data-text="dashboard.assistant.eyebrow"></div>
            <h2 data-text="dashboard.assistant.title"></h2>
            <p data-text="dashboard.assistant.body"></p>
            <button class="btn" onclick="showPage('inbox')" data-text="buttons.reviewConversations"></button>
          </div>

          <div class="card section">
            <div class="section-head">
              <div>
                <div class="eyebrow" data-text="dashboard.popularAnswers.eyebrow"></div>
                <h2 data-text="dashboard.popularAnswers.title"></h2>
              </div>
            </div>
            <div class="knowledge" id="dashboard-answers"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="inbox" class="page">
      <div class="topbar">
        <div>
          <div class="eyebrow" data-text="inbox.eyebrow"></div>
          <h1 data-text="inbox.title"></h1>
        </div>
        <button class="btn primary" data-text="buttons.connectInbox"></button>
      </div>
      <div class="page-grid">
        <div class="card section">
          <input class="searchbar" data-placeholder="inbox.searchPlaceholder" />
          <div class="inbox-list" id="inbox-enquiries"></div>
        </div>

        <div class="card section">
          <div class="section-head">
            <div>
              <div class="eyebrow" data-text="inbox.preview.eyebrow"></div>
              <h2 data-text="inbox.preview.title"></h2>
            </div>
          </div>
          <div class="chat">
            <div class="msg user" data-text="inbox.preview.guestMessage"></div>
            <div class="msg ai" data-text="inbox.preview.draftReply"></div>
          </div>
          <div class="mini-actions">
            <button class="btn primary" data-text="buttons.send"></button>
            <button class="btn" data-text="buttons.edit"></button>
            <button class="btn" data-text="buttons.regenerate"></button>
          </div>
        </div>
      </div>
    </section>

    <section id="availability" class="page">
      <div class="topbar">
        <div>
          <div class="eyebrow" data-text="availability.eyebrow"></div>
          <h1 data-text="availability.title"></h1>
        </div>
        <button class="btn primary" data-text="buttons.blockDates"></button>
      </div>
      <div class="card section">
        <div class="section-head">
          <div>
            <h2 data-demo="availability.month"></h2>
            <p data-text="availability.legend"></p>
          </div>
        </div>
        <div class="table-wrap">
          <table id="availability-calendar"></table>
        </div>
      </div>
    </section>

    <section id="bookings" class="page">
      <div class="topbar">
        <div>
          <div class="eyebrow" data-text="bookings.eyebrow"></div>
          <h1 data-text="bookings.title"></h1>
        </div>
        <button class="btn primary" onclick="openNewBooking()" data-text="buttons.newBooking"></button>
      </div>

      <div class="card section" id="bookings-list">
        <input class="searchbar" data-placeholder="bookings.searchPlaceholder" />
      </div>
    </section>

    <section id="invoices" class="page">
      <div class="topbar">
        <div>
          <div class="eyebrow" data-text="invoices.eyebrow"></div>
          <h1 data-text="invoices.title"></h1>
        </div>
        <button class="btn primary" data-text="buttons.createInvoice"></button>
      </div>
      <div class="card section">
        <div class="table-wrap">
          <table id="invoices-table"></table>
        </div>
      </div>
    </section>

    <section id="knowledge" class="page">
      <div class="topbar">
        <div>
          <div class="eyebrow" data-text="knowledge.eyebrow"></div>
          <h1 data-text="knowledge.title"></h1>
        </div>
        <button class="btn primary" data-text="buttons.addInformation"></button>
      </div>
      <div class="page-grid">
        <div class="card section">
          <div class="knowledge" id="knowledge-topics"></div>
        </div>
        <div class="card section">
          <div class="section-head">
            <div><h2 data-text="knowledge.test.title"></h2><p data-text="knowledge.test.intro"></p></div>
          </div>
          <div class="chat">
            <div class="msg user" data-text="knowledge.test.question"></div>
            <div class="msg ai" data-text="knowledge.test.answer"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="automations" class="page">
      <div class="topbar">
        <div>
          <div class="eyebrow" data-text="automations.eyebrow"></div>
          <h1 data-text="automations.title"></h1>
        </div>
        <button class="btn primary" data-text="buttons.newAutomation"></button>
      </div>
      <div class="card section" id="automations-list"></div>
    </section>

    <section id="reports" class="page">
      <div class="topbar">
        <div>
          <div class="eyebrow" data-text="reports.eyebrow"></div>
          <h1 data-text="reports.title"></h1>
        </div>
        <button class="btn" data-text="buttons.exportReport"></button>
      </div>
      <div class="grid metrics" id="reports-metrics"></div>
    </section>

    <section id="settings" class="page">
      <div class="topbar">
        <div>
          <div class="eyebrow" data-text="settings.eyebrow"></div>
          <h1 data-text="settings.title"></h1>
        </div>
        <button class="btn primary" onclick="demoToast(CONTENT.toasts.settingsSaved)" data-text="buttons.saveChanges"></button>
      </div>
      <div class="page-grid">
        <div class="card section">

  /* ===== Below here is code. You should not need to edit it to change wording. ===== */

  function esc(value){
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function lookup(source, path){
    return path.split('.').reduce((obj, key) => obj == null ? undefined : obj[key], source);
  }

  function statusPill(status){
    return `<span class="status ${esc(status.colour)}">${esc(status.text)}</span>`;
  }

  function metricCards(labels, values){
    return Object.keys(labels).map(key => `
        <div class="card metric">
          <div class="label">${esc(labels[key])}</div>
          <div class="value">${esc(values[key].value)}</div>
          <div class="trend">${esc(values[key].trend)}</div>
        </div>`).join('');
  }

  function availabilityTable(nightCount, cellText){
    const a = DEMO_DATA.availability;
    const dates = a.dates.slice(0, nightCount);
    return `
      <thead>
        <tr><th>${esc(CONTENT.availability.roomColumn)}</th>${dates.map(d => `<th>${esc(d)}</th>`).join('')}</tr>
      </thead>
      <tbody>
        ${a.rooms.map(r => `
        <tr>
          <td>${esc(r.room)}</td>${r.nights.slice(0, nightCount).map(n => `<td class="availability-cell ${esc(n)}">${esc(cellText[n])}</td>`).join('')}
        </tr>`).join('')}
      </tbody>`;
  }

  function tiles(items){
    return items.map(t => `<div class="tile"><b>${esc(t.title)}</b><span>${esc(t.text)}</span></div>`).join('');
  }

  function render(){
    document.title = CONTENT.pageTitle;

    document.querySelectorAll('[data-text]').forEach(el => { el.textContent = lookup(CONTENT, el.dataset.text); });
    document.querySelectorAll('[data-demo]').forEach(el => { el.textContent = lookup(DEMO_DATA, el.dataset.demo); });
    document.querySelectorAll('[data-placeholder]').forEach(el => { el.placeholder = lookup(CONTENT, el.dataset.placeholder); });
    document.querySelectorAll('[data-value]').forEach(el => { el.value = lookup(CONTENT, el.dataset.value); });
    document.querySelectorAll('[data-demo-value]').forEach(el => { el.value = lookup(DEMO_DATA, el.dataset.demoValue); });

    const d = CONTENT.dashboard;

    document.getElementById('dashboard-metrics').innerHTML =
      metricCards(d.metricLabels, DEMO_DATA.dashboardMetrics);

    document.getElementById('dashboard-pipeline').innerHTML = Object.keys(d.pipeline.stages).map(key =>
      `<div class="pipe"><span>${esc(d.pipeline.stages[key])}</span><b>${esc(DEMO_DATA.pipeline[key])}</b></div>`).join('');

    document.getElementById('dashboard-enquiries').innerHTML = d.recentEnquiries.items.map(e => `
      <div class="inbox-item">
        <div>
          <strong>${esc(e.name)}</strong>
          <div class="inbox-meta">${esc(e.details)}<br>${esc(e.note)}</div>
        </div>
        ${statusPill(e.status)}
      </div>`).join('');

    document.getElementById('dashboard-availability').innerHTML =
      availabilityTable(4, CONTENT.availability.cellLabels);

    document.getElementById('dashboard-attention').innerHTML = d.attention.items.map(a => `
      <div class="attention-item">
        <strong>${esc(a.title)}</strong>
        <p>${esc(a.detail)}</p>
      </div>`).join('');

    document.getElementById('dashboard-answers').innerHTML = tiles(d.popularAnswers.tiles);

    const inboxList = document.getElementById('inbox-enquiries');
    inboxList.innerHTML = CONTENT.inbox.enquiries.map(e => `
      <div class="inbox-item">
        <div>
          <strong>${esc(e.name)}</strong>
          <div class="inbox-meta">${esc(e.details)}<br>${esc(e.message)}</div>

    inboxList.querySelectorAll('[data-toast]').forEach(btn => {
      btn.addEventListener('click', () => demoToast(btn.dataset.toast));
    });

    document.getElementById('availability-calendar').innerHTML =
      availabilityTable(DEMO_DATA.availability.dates.length, CONTENT.availability.cellLetters);

    const f = CONTENT.bookings.fieldLabels;

      <thead>
        <tr>${CONTENT.invoices.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr>

      <div class="booking-card">

          <div><h3>${esc(a.name)}</h3><div class="inbox-meta">${esc(a.steps)}</div></div>

    document.getElementById('settings-provisional').innerHTML =
      DEMO_DATA.settings.provisionalPeriods.map(p => `<option>${esc(p)}</option>`).join('');
  }

  render();

  const navButtons = document.querySelectorAll('.nav button[data-page]');
  const pages = document.querySelectorAll('.page');

  // Pages each setup mode hides. Nothing new is built; existing screens are only shown or hidden.
  const MODE_HIDDEN_PAGES = {
    layer: ['bookings', 'invoices', 'reports'],
    full: [],
  };
  let currentMode = SETUP_MODE;

  function isHidden(pageId){
    return (MODE_HIDDEN_PAGES[currentMode] || []).includes(pageId);
  }

  function applyMode(mode){
    currentMode = mode;
    navButtons.forEach(b => b.classList.toggle('mode-hidden', isHidden(b.dataset.page)));
    pages.forEach(p => p.classList.toggle('mode-hidden', isHidden(p.id)));
    document.querySelectorAll('[data-needs-page]').forEach(el => {
      el.classList.toggle('mode-hidden', isHidden(el.dataset.needsPage));
    });
    document.querySelectorAll('.mode-options button').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    const current = document.querySelector('.page.active');
    if(current && isHidden(current.id)) showPage('dashboard');
  }

  document.querySelectorAll('.mode-options button').forEach(btn => {
    btn.addEventListener('click', () => applyMode(btn.dataset.mode));
  });

  function showPage(id){
    if(isHidden(id)) return;
    pages.forEach(p => p.classList.remove('active'));
    navButtons.forEach(b => b.classList.remove('active'));
    const page = document.getElementById(id);
    if(page) page.classList.add('active');
    const btn = document.querySelector(`.nav button[data-page="${id}"]`);
    if(btn) btn.classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  }

  navButtons.forEach(btn => {
    btn.addEventListener('click', () => showPage(btn.dataset.page));
  });

  applyMode(SETUP_MODE);

  function openNewBooking(){
    showPage('bookings');
    demoToast(CONTENT.toasts.newBooking);
  }

  function demoToast(message){
    const toast = document.createElement('div');
    toast.textContent = message;
    toast.style.position = 'fixed';
    toast.style.right = '24px';
    toast.style.bottom = '24px';
    toast.style.background = '#15372d';
    toast.style.color = '#fff';
    toast.style.padding = '13px 16px';
    toast.style.borderRadius = '12px';
    toast.style.boxShadow = '0 10px 30px rgba(0,0,0,.18)';
    toast.style.zIndex = '9999';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2200);
  }
</script>
